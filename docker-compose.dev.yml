services:
  db:
    image: postgres:16-alpine
    container_name: digital_card_db_dev
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_card
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    container_name: digital_card_app_dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.development
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@db:5432/digital_card?schema=public'
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
