services:
  db:
    image: postgres:16-alpine
    container_name: digital_card_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-digital_card}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: prod
    container_name: digital_card_app_prod
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-digital_card}?schema=public'
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_prod:
